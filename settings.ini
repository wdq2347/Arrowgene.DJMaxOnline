# Arrowgene.DJMaxOnline server settings.
# One setting per line. Repeat a key to build a list.
# Lines starting with # or ; are ignored. Delete this file to regenerate it.
# CLI flags and environment variables override anything set here.
# Relative filesystem paths are resolved from the folder containing this file.

# Channel name shown in the client's server list.
Name = Arrowgene
ListenIpAddress = 127.0.0.1
ServerPort = 3000
SevenKeyServerPort = 3005
AdvertisedIpAddress = 127.0.0.1
# Where the client fetches song archives. Must match the FTP settings below.
DownloadUrl = ftp://BLADE:BLADE@127.0.0.1/song/
# Captured game-info payloads and client catalogs.
GameInfoDirectory = DATA
GameInfoFallbackDiscId = 1
FtpEnabled = false
FtpListenIpAddress = 127.0.0.1
FtpPort = 21
FtpAdvertisedIpAddress = 127.0.0.1
FtpRootDirectory = paks
FtpUsername = BLADE
FtpPassword = BLADE
FtpFallbackChartPath =
# DiscStock.csv. MUST match the client's copy or charts fail to decode.
SongCatalogPath = DATA/DiscStock.csv
# Plaintext PTFF charts. Empty = use captured payloads instead.
PatternsDirectory = Patterns
# ItemStock/DiscStock/Goods lists, and the player database.
ShopDataDirectory = DATA
LoginPipeName = Arrowgene.DJMaxOnline.Login.v1

# HTTP login API for REMOTE launchers. Put it behind a Cloudflare Tunnel or TLS proxy -
# it has no TLS of its own. The named pipe stays on for a launcher on this machine.
LoginApiEnabled = true
LoginApiListenIpAddress = 127.0.0.1
LoginApiPort = 8091
LoginReconnectGraceSeconds = 30
# Repeat this key for more lines.
MessageOfTheDay =
# Scales the final EXP award. Level thresholds cannot change.
ExperienceMultiplier = 1
# Granted to every account, e.g. Premium.
DefaultAccountClassFlags = Premium
# 0 makes gear cosmetic; 100 is full effect.
EquipmentHpPercent = 100
# New shop and course items are permanent; existing inventory timestamps stay untouched.
ItemsNeverExpire = true
# Offer every course from CourseSection.ini without changing saved prerequisite progress.
UnlockAllCourses = true
EquipmentMaxPercent = 100
EquipmentExperiencePercent = 100
# Scales the final MAX award.
MoneyMultiplier = 1
# Extra payout for premium accounts, on top of everything else.
PremiumRewardBonusPercent = 100
# Chance a random-disc pick becomes a DJ Mission match.
MissionMatchChancePercent = 10
# Per match mode (0 free, 1 ranked, 2 score, 3 item, 4 course). Negative = tighter.
JudgmentAdjustmentMsByMatchMode =
# name | accuracy | noteMultiple | code
# reason for this being a config is other versions have different ones(annoying)
AccuracyDiscs = Sapphire Disc | 1 | 1 | 0x409
AccuracyDiscs = Ruby Disc | 10 | 1 | 0x400
AccuracyDiscs = Devil Disc | 66.6 | 5 | 0x40A
AccuracyDiscs = Rainbow MAX | 77.7 | 10 | 0x401
# Packed song archives served as /song/<tag>.pak.
PakDirectory = songs

# Password HASHING POLICY only. Salts and hashes live per-account in the
# player database, never here. Iterations and SaltSize affect only NEW
# credentials: each stored credential records the cost it was hashed with,
# so raising this does not invalidate existing accounts.
PasswordPolicy.Iterations = 600000
PasswordPolicy.SaltSize = 16
PasswordPolicy.MinimumLength = 10
PasswordPolicy.MaximumLength = 128

# Base payout before the multipliers above. Pure server policy - the retail
# economy is not encoded anywhere in the client.
RewardRates.MoneyPerNoteHit = 1
RewardRates.NotesHitPerExperience = 3
RewardRates.FullComboMoneyBonus = 100
RewardRates.FullComboExperienceBonus = 50
RewardRates.FailureDivisor = 2
# How close accuracy must be to an AccuracyDiscs entry to earn it.
AccuracyDiscTolerance = 0.005
# How long a launcher ticket stays redeemable (max 300).
LoginTicketLifetimeSeconds = 60

# Content delivery over HTTP instead of the embedded FTP server: /song/ for the
# client's own downloads and /patch/ for what the launcher installs.
ContentDelivery = Http
ContentBaseUrl = http://127.0.0.1:8080/
ContentSongPath = song/
HttpContentEnabled = true
HttpContentListenIpAddress = 127.0.0.1
HttpContentPort = 8080

# LOCAL read-only status API for tooling. NOT for public exposure.
StatusApiEnabled = true
StatusApiListenIpAddress = 127.0.0.1
StatusApiPort = 8090
StatusApiToken =

# Added by a newer build.
ContentPatchPath = patch/
PatchDirectory = patch
PatchManifestAutoBuild = true
PatchManifestFileName = md5list.txt
PatchNewsFileName = news.txt

# Added by a newer build.
# Combo per item-battle item drop. Server policy; the client has no drop rule.
BattleItemComboInterval = 50

# Added by a newer build.
# Clearing a course rolls its random item award; false grants no item (MAX and EXP bonuses are unaffected).
CourseItemRewards = true
